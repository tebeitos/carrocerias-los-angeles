<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <clipPath id="rounded-card">
      <rect width="128" height="128" rx="28" ry="28" />
    </clipPath>
  </defs>
  
  <!-- Fondo dividido: Izquierda negra, Derecha roja, con marco grueso negro -->
  <g clip-path="url(#rounded-card)">
    <rect width="64" height="128" fill="#1A1A1A" />
    <rect x="64" width="64" height="128" fill="#D6221F" />
    <rect width="128" height="128" fill="none" stroke="#1A1A1A" stroke-width="12" />
  </g>
  
  <!-- Estrella amarilla característica del taller en la parte superior -->
  <polygon points="64,15 69,29 84,29 72,38 76,52 64,43 52,52 56,38 44,29 59,29" fill="#F2C300" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round" />
  
  <!-- Monograma LA en amarillo con borde negro en tipografía gruesa -->
  <text x="63" y="104" font-family="'Anton', 'Arial Black', Impact, sans-serif" font-size="58" font-weight="900" fill="#F2C300" stroke="#1A1A1A" stroke-width="8" stroke-linejoin="round" text-anchor="middle" letter-spacing="-3">LA</text>
</svg>
